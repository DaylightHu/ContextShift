[project]
name = "contextshift"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "DaylightHu", email = "tianxiao.hu@nio.com" }
]
requires-python = ">=3.11"
dependencies = [
    "openai>=3.42.0",
    "pydantic-settings>=2.16.2",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[project.scripts]
contextshift = "contextshift.cli:app"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
]
