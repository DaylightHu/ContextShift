[project]
name = "contextshift"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "DaylightHu", email = "3343495642@qq.com" }
]
requires-python = ">=3.11"
dependencies = [
    "openai>=3.42.0",
    "prompt-toolkit>=3.0.53",
    "pydantic-settings>=2.16.2",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[project.optional-dependencies]
desktop = ["PySide6-Essentials>=6.8"]
bundle = ["pyinstaller>=6.12"]
speech = [
    "funasr>=1.2.7",
    "numpy>=2.2.0",
    "sounddevice>=0.5.1",
    "torch>=2.15.0",
    "torchaudio>=2.11.1",
]

[project.scripts]
contextshift = "contextshift.cli:app"
contextshift-gui = "contextshift.desktop.app:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
